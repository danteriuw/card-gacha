<!DOCTYPE html><html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Gacha System</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle, #064e3b, #022c22);
    font-family: Arial, sans-serif;
    overflow: hidden;
    color: white;
  }.container { text-align: center; }

button { padding: 14px 28px; font-size: 18px; border: none; border-radius: 12px; background: linear-gradient(135deg, #b91c1c, #7f1d1d); color: #fff; cursor: pointer; box-shadow: 0 0 20px rgba(185,28,28,0.7); transition: 0.3s; }

button:hover { transform: scale(1.1); }

.stage { position: relative; width: 220px; height: 280px; margin-top: 30px; }

.card { width: 150px; height: 210px; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); perspective: 1000px; z-index: 5; opacity: 0; /* começa invisível */ transition: opacity 0.4s ease; }

.card-inner { width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.8s; }

.card.flip .card-inner { transform: rotateY(180deg); }

.face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; background-size: cover; }

.back { background-image: url('https://deckofcardsapi.com/static/img/back.png'); } .front { transform: rotateY(180deg); }

.suit { position: absolute; font-size: 180px; opacity: 0; transform: translate(-50%, -50%) scale(0); left: 50%; top: 50%; transition: 0.5s; z-index: 10; }

.suit.show { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }

.particles span { position: absolute; width: 6px; height: 6px; background: white; border-radius: 50%; animation: rise 1s linear forwards; }

@keyframes rise { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-120px); opacity: 0; } }

.rare-glow { position: absolute; width: 250px; height: 250px; border-radius: 50%; background: radial-gradient(circle, gold, transparent); animation: pulse 1s; }

@keyframes pulse { from { transform: scale(0); opacity: 1; } to { transform: scale(2); opacity: 0; } }

.screen-flash { position: fixed; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; }

.flash { animation: flash 0.3s; }

@keyframes flash { 0% { opacity: 0.8; } 100% { opacity: 0; } } </style>

</head>
<body><div class="screen-flash" id="flash"></div><div class="container">
  <button onclick="draw()">Abrir Carta</button>  <div class="stage" id="stage">
    <div id="suit" class="suit"></div><div class="card" id="card">
  <div class="card-inner">
    <div class="face back"></div>
    <div class="face front" id="front"></div>
  </div>
</div>

  </div>
</div><script>
const suits = ['♠','♥','♦','♣'];
const suitsCode = ['S','H','D','C'];
const values = ['A','2','3','4','5','6','7','8','9','0','J','Q','K'];

let busy = false;

function draw() {
  if (busy) return;
  busy = true;

  const suitEl = document.getElementById('suit');
  const card = document.getElementById('card');
  const front = document.getElementById('front');
  const stage = document.getElementById('stage');
  const flash = document.getElementById('flash');

  const value = values[Math.floor(Math.random()*values.length)];
  const i = Math.floor(Math.random()*4);

  const suit = suits[i];
  const code = value + suitsCode[i];

  const isFace = value === 'J' || value === 'Q' || value === 'K';
  const isAce = value === 'A';

  // 🔴 ESCONDE COMPLETAMENTE A CARTA
  card.style.visibility = "hidden";
  card.style.opacity = 0;

  // MOSTRA NAIPE
  suitEl.textContent = suit;
  suitEl.style.color = (suit==='♥'||suit==='♦') ? 'red' : 'white';
  suitEl.classList.add('show');

  // partículas
  for(let i=0;i<15;i++){
    const p = document.createElement('span');
    p.style.left = Math.random()*200+'px';
    p.style.top = '150px';
    p.classList.add('particles');
    stage.appendChild(p);
    setTimeout(()=>p.remove(),1000);
  }

  setTimeout(()=>{

    suitEl.classList.remove('show');

    front.style.backgroundImage = `url(https://deckofcardsapi.com/static/img/${code}.png)`;

    // 🟢 MOSTRA CARTA COM FADE + FLIP
    card.style.visibility = "visible";
    setTimeout(()=>{
      card.style.opacity = 1;
      card.classList.add('flip');
    },50);

    if(isFace || isAce){
      const glow = document.createElement('div');
      glow.classList.add('rare-glow');

      // diferencia o estilo
      if(isAce){
        glow.style.background = 'radial-gradient(circle, #9ca3af, transparent)'; // cinza
      } else {
        glow.style.background = 'radial-gradient(circle, gold, transparent)'; // J Q K dourado
      }

      stage.appendChild(glow);
      setTimeout(()=>glow.remove(),1000);

      flash.classList.add('flash');
      setTimeout(()=>flash.classList.remove('flash'),300);
    }

    setTimeout(()=>{
      busy = false;
      card.classList.remove('flip');
    },1500);

  },800);
}
</script>

</body>
</html>
